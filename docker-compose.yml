services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: vision_annotator
      POSTGRES_USER: vision
      POSTGRES_PASSWORD: vision_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data

  # MinIO removed its community images from Docker Hub and locked quay.io
  # (2025). Chainguard publishes free, CVE-patched builds of the actual
  # MinIO codebase — drop-in compatible, credentials enforced as before.
  storage:
    image: cgr.dev/chainguard/minio:latest
    command: server /data --address :9000 --console-address :9001
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio_dev_password
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  redis_data:
  minio_data:
