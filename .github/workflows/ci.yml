name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable corepack (Yarn 4)
        run: corepack enable
      - name: Install dependencies
        run: yarn install --immutable
      - name: Generate Prisma client
        run: yarn workspace @vision-annotator/api prisma:generate
      - name: Lint
        run: yarn workspace @vision-annotator/api lint
      - name: Typecheck
        run: yarn workspace @vision-annotator/api typecheck
      - name: Test
        run: yarn workspace @vision-annotator/api test

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable corepack (Yarn 4)
        run: corepack enable
      - name: Install dependencies
        run: yarn install --immutable
      - name: Lint
        run: yarn workspace @vision-annotator/web lint
      - name: Typecheck
        run: yarn workspace @vision-annotator/web typecheck
      - name: Test
        run: yarn workspace @vision-annotator/web test
      - name: Build
        run: yarn workspace @vision-annotator/web build
        env:
          NEXT_TELEMETRY_DISABLED: 1
